- name: Configure BIND9 DNS Server
  hosts: dns
  become: yes
  vars:
    tsig_key_path: /etc/bind/ddns.key

  tasks:

    - name: Install BIND9
      apt:
        name: bind9
        state: present
        update_cache: yes

    - name: Generate TSIG key if it does not exist
      command: tsig-keygen -a hmac-sha256 ddns-key
      register: tsig_key
      args:
        creates: "{{ tsig_key_path }}"

    - name: Save TSIG key to file
      copy:
        content: "{{ tsig_key.stdout }}"
        dest: "{{ tsig_key_path }}"
        owner: root
        group: bind
        mode: '0600'
      when: tsig_key is changed

    - name: Extract TSIG secret
      set_fact:
        tsig_secret: "{{ tsig_key.stdout | regex_search('secret\\s+\"([^\"]+)\"', '\\1', ignorecase=True) }}"
      when: tsig_key is changed

    - name: Include TSIG key in named.conf.options
      blockinfile:
        path: /etc/bind/named.conf.options
        marker: "# {mark} ANSIBLE DDNS KEY"
        block: |
          key "ddns-key" {
            algorithm hmac-sha256;
            secret "{{ tsig_secret }}";
          };
      when: tsig_key is changed

    - name: Copy named.conf.options
      copy:
        src: named.conf.options
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: '0644'

    - name: Copy named.conf.local
      copy:
        src: named.conf.local
        dest: /etc/bind/named.conf.local
        owner: root
        group: bind
        mode: '0644'

    - name: Copy zone file for forward lookup
      copy:
        src: db.jhingal.izv
        dest: /etc/bind/db.jhingal.izv
        owner: root
        group: bind
        mode: '0644'

    - name: Copy zone file for reverse lookup
      copy:
        src: db.192
        dest: /etc/bind/db.192
        owner: root
        group: bind
        mode: '0644'

    - name: Ensure BIND9 is started and enabled
      service:
        name: bind9
        state: started
        enabled: yes
