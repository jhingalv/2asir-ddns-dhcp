- name: Configure ISC DHCP Server
  hosts: dhcp
  become: yes
  vars:
    dhcp_interface: eth1
    tsig_temp_path: /tmp/ddns.key
    tsig_dest_path: /etc/dhcp/ddns.key

  tasks:

    - name: Install ISC DHCP Server
      apt:
        name: isc-dhcp-server
        state: present
        update_cache: yes

    - name: Copy TSIG key from DNS
      fetch:
        src: /etc/bind/ddns.key
        dest: "{{ tsig_temp_path }}"
        flat: yes
      delegate_to: dns

    - name: Copy TSIG key to DHCP server
      copy:
        src: "{{ tsig_temp_path }}"
        dest: "{{ tsig_dest_path }}"
        owner: root
        group: root
        mode: '0600'

    - name: Copy DHCP configuration
      copy:
        src: dhcpd.conf
        dest: /etc/dhcp/dhcpd.conf
        owner: root
        group: root
        mode: '0644'

    - name: Configure DHCP interface
      lineinfile:
        path: /etc/default/isc-dhcp-server
        regexp: '^INTERFACESv4='
        line: "INTERFACESv4=\"{{ dhcp_interface }}\""

    - name: Ensure DHCP server is started and enabled
      service:
        name: isc-dhcp-server
        state: restarted
        enabled: yes
