- name: Install ISC DHCP Server
  become: yes
  apt:
    name: isc-dhcp-server
    state: present
    update_cache: yes

- name: Copy TSIG key from DNS
  fetch:
    src: /etc/bind/ddns.key
    dest: /tmp/ddns.key
    flat: yes
    delegate_to: dns

- name: Copy TSIG key to DHCP server
  copy:
    src: /tmp/ddns.key
    dest: /etc/dhcp/ddns.key
    owner: root
    group: root
    mode: '0600'

- name: Copy DHCP configuration
  copy:
    src: dhcpd.conf
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: '0644'

- name: Configure DHCP interface
  lineinfile:
    path: /etc/default/isc-dhcp-server
    regexp: '^INTERFACESv4='
    line: 'INTERFACESv4="eth1"'

- name: Ensure DHCP server is started and enabled
  service:
    name: isc-dhcp-server
    state: restarted
    enabled: yes
